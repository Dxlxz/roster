version: "3.8"

services:
  db:
    container_name: roster-db
    image: postgres:16
    environment:
      POSTGRES_DB: roster
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    volumes:
      - roster-db-data:/var/lib/postgresql/data:Z

  redis:
    container_name: roster-redis
    image: redis:latest
    command: ["--maxmemory-policy", "noeviction"]
    volumes:
      - roster-redis-data:/data:Z

  server:
    container_name: roster-server
    image: roster/roster:latest
    stop_grace_period: 120s
    environment:
      NODE_PORT: "3000"
      SERVER_URL: ${SERVER_URL}
      PG_DATABASE_URL: "postgresql://roster:${PG_DATABASE_PASSWORD}@roster-db:5432/roster"
      REDIS_URL: "redis://roster-redis:6379"
      APP_SECRET: ${APP_SECRET}
      NODE_ENV: production
      LOG_LEVEL: info
    volumes:
      - roster-server-data:/app/docker-data:Z
    ports:
      - 127.0.0.1:8080:3000

  worker:
    container_name: roster-worker
    image: roster/roster:latest
    command: yarn worker:prod
    environment:
      SERVER_URL: ${SERVER_URL}
      PG_DATABASE_URL: "postgresql://roster:${PG_DATABASE_PASSWORD}@roster-db:5432/roster"
      REDIS_URL: "redis://roster-redis:6379"
      APP_SECRET: ${APP_SECRET}
      DISABLE_DB_MIGRATIONS: "true"
      NODE_ENV: production
      LOG_LEVEL: info
    volumes:
      - roster-server-data:/app/docker-data:Z
    init: true

volumes:
  roster-db-data:
  roster-server-data:
  roster-redis-data:
